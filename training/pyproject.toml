[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haojie-training"
version = "1.0.0"
description = "浩劫 Rust 原生多局与 BF16 连续 V-trace 训练"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.14.0", "numpy>=2.1,<3"]

[project.scripts]
haojie-train = "haojie_training.online.__main__:main"

[project.optional-dependencies]
dev = ["ruff==0.15.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["haojie_training*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["haojie_training", "scripts"]
