[package]
name = "haojie-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "haojie_native"
path = "src/library.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["allocator-mimalloc"]
allocator-mimalloc = ["dep:mimalloc"]

[dependencies]
indexmap = { version = "=2.10.0", features = ["serde"] }
mimalloc = { version = "=0.1.52", optional = true, default-features = false }
rustc-hash = "=2.1.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
