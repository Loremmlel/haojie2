name: Feedback 3 workbench
on:
  push:
    branches: [fix/feedback-3-20260920]
permissions:
  contents: write
concurrency:
  group: feedback-3-workbench
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct legacy descriptions
        run: |
          python - <<'PY'
          from pathlib import Path
          for file, old, new in [('README.md', '冰冻中立', '冰冻禁行'), ('src/engine/catalog.ts', '受到有随从来源的伤害时', '受到有棋子或基地来源的伤害时')]:
              p = Path(file)
              text = p.read_text()
              assert text.count(old) == 1, file
              p.write_text(text.replace(old, new))
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Reproduce final standalone release
        run: |
          npm run deploy
          echo '4d25b0cbb3e0a3df53ecc0a4d9d23edfeed6aebb4231d3d781dc5b35b6601f84  index.html' | sha256sum -c -
          npx prettier --check README.md src/engine/catalog.ts
          git diff --check
      - name: Commit source and release only
        run: |
          git add README.md src/engine/catalog.ts index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: align freeze and base-origin reflection descriptions'
          git push origin HEAD:fix/feedback-3-20260920
          git show --no-patch --format='%H %T'
