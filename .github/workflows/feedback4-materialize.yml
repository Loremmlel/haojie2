name: Materialize and verify feedback4 branch
on:
  push:
    branches: [fix/feedback4-20260921]
    paths: [scripts/feedback4-materialize.py, .github/workflows/feedback4-materialize.yml]
permissions:
  contents: write
concurrency:
  group: feedback4-materialize
  cancel-in-progress: false
jobs:
  materialize:
    if: github.ref == 'refs/heads/fix/feedback4-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/feedback4-20260921
      - name: Apply reviewed edits only on the isolated branch
        run: python3 scripts/feedback4-materialize.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Record the historical command sequence under the corrected rules without changing its original recording
        run: |
          node --import tsx --input-type=module <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          import {applyCommand, parseSession} from './src/engine/index.ts';
          import {RULESET_ID} from './src/engine/catalog.ts';
          import {fingerprint} from './src/ai/observation.ts';
          const rows = readFileSync('docs/playtests/cli-feedback3-20260920.jsonl','utf8').trim().split('\n').map(v=>JSON.parse(v));
          let s = parseSession(JSON.stringify(rows[0].initial)).present;
          const result = [{...rows[0], ruleset: RULESET_ID}];
          for (const row of rows.slice(1)) {
            const before = fingerprint(s); s = applyCommand(s,row.command);
            result.push({...row,before,after:fingerprint(s),events:s.events});
          }
          writeFileSync('docs/playtests/cli-feedback4-20260921.jsonl',result.map(v=>JSON.stringify(v)).join('\n')+'\n');
          console.log('Recorded',result.length-1,'commands under',RULESET_ID);
          JS
      - run: npm run format
      - run: npm run check
      - name: Run all behavior tests
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm test | tee artifacts/feedback4-engine-report.txt
      - run: npm run deploy
      - run: npm run deploy:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:feedback4
      - run: npm run play:cli -- --replay docs/playtests/cli-feedback4-20260921.jsonl
      - name: Commit verified source and regenerated standalone HTML to this branch only
        run: |
          test "$(git branch --show-current)" = 'fix/feedback4-20260921'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: correct giant rules and verify cannon, deployment snapshots and resume'
          git push origin HEAD:refs/heads/fix/feedback4-20260921
      - name: Package source and evidence for review
        if: always()
        run: |
          mkdir -p artifacts
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./artifacts' --exclude='./dist' -czf artifacts/feedback4-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback4-source-and-evidence
          path: |
            artifacts/feedback4-source.tar.gz
            artifacts/feedback4-engine-report.txt
            artifacts/feedback4-browser-report.json
            artifacts/feedback4-*.png
          retention-days: 7
