name: Temporary VFX review follow-up import
on:
  push:
    branches: [feat/vfx-identity]
    paths: ['.github/workflows/vfx-review-import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vfx-identity
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the verified review corrections
        run: |
          echo '5fd4eca36e74c6176b87556a2ab33a3059be1a2281df6863be4e667f0ebdf62b  .github/vfx-review.patch.xz' | sha256sum -c -
          xz -dc .github/vfx-review.patch.xz > /tmp/vfx-review.patch
          git apply --check /tmp/vfx-review.patch
          git apply /tmp/vfx-review.patch
          rm .github/vfx-review.patch.xz .github/workflows/vfx-review-import.yml
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check && npm run check && npm test
      - run: npm run deploy && npm run deploy:check
      - run: echo 'c963d89fde5e5856e905f7ca40c86a37a80dfda442cae6911501ef8d32e50ce4  index.html' | sha256sum -c -
      - name: Commit review corrections and regenerated HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(vfx): separate hook contact from arrival and harden single-batch limits'
          git push origin HEAD:feat/vfx-identity
