name: Shrine development validation
on:
  push:
    branches: [feat/3.0-shrine-mode]
    paths: ['.github/workflows/shrine-development.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Export isolated source and dependencies for recovery
        run: |
          mkdir -p /tmp/shrine-recovery
          git archive HEAD | gzip > /tmp/shrine-recovery/source.tar.gz
          tar -czf /tmp/shrine-recovery/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: shrine-development-recovery
          path: /tmp/shrine-recovery/*.tar.gz
          retention-days: 1
