name: Shrine development validation
on:
  push:
    branches: [feat/3.0-shrine-mode]
    paths: ['.github/workflows/shrine-development.yml']
permissions:
  contents: write
jobs:
  recover:
    if: github.ref == 'refs/heads/feat/3.0-shrine-mode'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3.0-shrine-mode
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover source with per-file and whole-payload checksums
        run: python3 .github/apply-shrine.py
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run deploy
      - name: Verify deterministic offline artifact and unchanged workflows
        run: |
          echo 'c61cce79de214c35e9077498afa8cf9454b49fedcd4b09e5040ad71fe10ec1a6  index.html' | sha256sum --check
          git diff --exit-code -- .github/workflows
      - name: Commit only verified feature-branch source and remove transfer files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(3.0): add shrine mode, landmarks, permanent auras and AI support'
          git push origin HEAD:refs/heads/feat/3.0-shrine-mode
