name: Training runtime
on:
  push:
    branches: [main]
    paths: &training-paths
      - 'training/haojie/**'
      - '!training/haojie/web/**'
      - 'training/tests/**'
      - '!training/tests/test_web.py'
      - 'training/requirements.txt'
      - 'native/**'
      - '.github/workflows/training.yml'
  pull_request:
    paths: *training-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: training-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # 搜索差分读取固定 Git 版本中的参考算法。
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 仅构建训练所需运行库；此工作流不运行引擎测试或 TS/Rust 规则差分。
      - run: cargo build --locked --release --lib --manifest-path native/engine/Cargo.toml --target-dir artifacts/native-target
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r training/requirements.txt
      - run: python -B -m unittest training.tests.test_training training.tests.test_pipeline training.tests.test_storage training.tests.test_profiling training.tests.test_evaluation -v
