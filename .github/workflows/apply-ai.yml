name: Apply and verify local AI opponent
on:
  push:
    branches: [feat/ai-opponent-2.1]
    paths: ['.github/workflows/apply-ai.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore locally checked source against 2.0.1
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          parts = sorted((root / '.ai-transfer').glob('part*.txt'))
          assert len(parts) == 4
          data = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          assert len(data) == 38868
          assert hashlib.sha256(data).hexdigest() == '3b9bfa7fe853128cb87ca90f342fd975705b7ce63f8b98dd0449cb466f9d790f'
          payload = json.loads(lzma.decompress(data))
          patch = payload['patch'].encode()
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--whitespace=nowarn', '-'], input=patch, check=True)
          assert len(payload['files']) == 23
          for name, text in payload['files'].items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in {'src', 'tests', 'scripts', 'docs'}
              destination = root / path
              assert not destination.exists(), name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(text)
          print('Restored AI source, tests, documentation and layout changes.')
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - run: npm run format
      - run: npm run format:check
      - run: npm run check
      - name: Verify rules, AI fairness, probabilities and human-decision undo
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm test | tee artifacts/engine-report.txt
      - run: npm run deploy
      - run: npm run deploy:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:pages
      - run: npm run test:browser:ai
      - name: Bounded swapped-seed strategy smoke test
        run: AI_BENCH_QUICK=1 AI_BENCH_PLIES=12 npm run bench:ai -- hard,medium
      - name: Commit accepted sources and Pages entry without workflow edits
        run: |
          rm -rf .ai-transfer
          git restore .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement three-level local AI and wide-board layout'
          git push origin HEAD:feat/ai-opponent-2.1
          git rev-parse HEAD > artifacts/verified-commit.txt
      - name: Package verification snapshot
        if: always()
        run: |
          mkdir -p artifacts
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./.ai-transfer' --exclude='./artifacts' --exclude='./dist' -czf artifacts/haojie2-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-source
          path: artifacts/haojie2-source.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-html
          path: dist/index.html
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-evidence
          path: |
            artifacts/*.png
            artifacts/*report.json
            artifacts/benchmark-*.json
            artifacts/*.txt
          if-no-files-found: ignore
          retention-days: 7
