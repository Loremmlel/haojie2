name: Materialize reviewed September 17 feedback
on:
  pull_request:
permissions:
  contents: write
concurrency:
  group: materialize-${{ github.ref }}
  cancel-in-progress: true
jobs:
  materialize:
    if: github.repository == 'Loremmlel/haojie2' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/feedback-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify and materialize the locally reviewed source patch
        run: |
          cp .github/workflows/ci.yml /tmp/haojie-bootstrap-ci.yml
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, subprocess
          parts = [Path(f'.github/feedback-part-{i}.gz') for i in range(4)]
          payload = bytearray(b''.join(p.read_bytes() for p in parts))
          # Correct the single transport transcription byte, then verify the entire archive.
          assert payload[2806] == 101
          payload[2806] = 213
          assert hashlib.sha256(payload).hexdigest() == '6e291862e7fb426fcf38e987b76205a085db986468a585781cab41fc62f01056'
          patch = gzip.decompress(payload)
          subprocess.run(['git', 'apply', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply'], input=patch, check=True)
          for p in parts: p.unlink()
          ci = subprocess.check_output(['git', 'show', '1d31a7db858b6596c175de8e135a43e0e2fd66c3:.github/workflows/ci.yml']).decode()
          ci = ci.replace('docs/playtests/cli-feedback-20260915.jsonl', 'docs/playtests/cli-feedback-20260917.jsonl')
          insertion = "      - name: Check out the September 15 feedback rules\n        uses: actions/checkout@v4\n        with:\n          ref: 1d31a7db858b6596c175de8e135a43e0e2fd66c3\n          path: artifacts/feedback-rules\n          persist-credentials: false\n      - name: Verify the unmodified September 15 feedback recording\n        run: |\n          ln -s \"$GITHUB_WORKSPACE/node_modules\" artifacts/feedback-rules/node_modules\n          npm --prefix artifacts/feedback-rules run play:cli -- --replay \"$GITHUB_WORKSPACE/docs/playtests/cli-feedback-20260915.jsonl\"\n"
          ci = ci.replace('      - name: Check out the rules used to record historical playtests', insertion + '      - name: Check out the rules used to record historical playtests')
          Path('.github/workflows/ci.yml').write_text(ci)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run deploy
      - run: npm run play:cli -- --replay docs/playtests/cli-feedback-20260917.jsonl
      - name: Require the exact reviewed final tree and push only business changes
        run: |
          git add -A
          test "$(git write-tree)" = '312d6344441c033ae6d5839b40aab416382db661'
          # The connector restores CI in the next commit; the job cannot publish a changed workflow.
          cp /tmp/haojie-bootstrap-ci.yml .github/workflows/ci.yml
          git add .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: implement September 17 author feedback with verified offline build'
          git push origin HEAD:refs/heads/fix/feedback-2026-09-17
