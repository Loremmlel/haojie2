name: Verify and build single HTML
on:
  push:
    branches: [main]
    paths: &game-paths
      - 'src/**'
      - 'examples/**'
      - 'tests/**'
      - 'docs/playtests/current/**'
      - '!tests/training/**'
      - '!tests/browser/console/**'
      - 'scripts/ai/**'
      - 'scripts/vfx/**'
      - 'scripts/build.mjs'
      - 'scripts/pages.mjs'
      - 'scripts/check-structure.mjs'
      - 'index.html'
      - '.nojekyll'
      - '.gitattributes'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths: *game-paths
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact dependency tree
        run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run check
      - run: npm run check:structure
      - run: |
          set -o pipefail
          mkdir -p artifacts
          npm run test:game | tee artifacts/engine-report.txt
      - run: npm run deploy:check
      - name: Install browser for acceptance testing
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser:library
      - run: npm run test:pages
      - run: npm run test:browser:ai
      - run: npm run test:browser:vfx
      - run: npm run test:browser:shrine
      - run: npm run test:browser:feedback3
      - run: npm run test:browser:feedback4
      - run: npm run test:browser:online
      - run: node --import tsx scripts/ai/shrine-smoke.ts
      - name: Upload the playable standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: haojie2-single-html
          path: dist/index.html
          if-no-files-found: error
          retention-days: 30
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: |
            artifacts/*.png
            artifacts/*report.json
            artifacts/engine-report.txt
          if-no-files-found: ignore
          retention-days: 7
