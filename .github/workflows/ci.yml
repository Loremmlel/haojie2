name: Materialize verified 2.5 synthesis
on:
  pull_request:
permissions:
  contents: write
concurrency:
  group: materialize-${{ github.ref }}
  cancel-in-progress: true
jobs:
  materialize:
    if: github.repository == 'Loremmlel/haojie2' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/2.5-synthesis'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and materialize the locally tested source
        run: |
          cp .github/workflows/ci.yml /tmp/haojie-bootstrap-ci.yml
          python3 - <<'PY'
          from pathlib import Path
          import base64, bz2, hashlib, subprocess
          paths = [Path(f'.github/synthesis-part-{i}.bz2') for i in range(4)]
          parts = [p.read_bytes() for p in paths]
          # Correct two verified text-transcription regions before validating the entire archive.
          text = base64.b64encode(parts[0]).decode()
          assert text[4432:4434] == 'VV' and text[4448:4450] == 'qq'
          text = text[:4448] + text[4450:]
          text = text[:4432] + text[4434:]
          parts[0] = base64.b64decode(text, validate=True)
          text = base64.b64encode(parts[1]).decode()
          assert text[2295:2297] == 'RE'
          parts[1] = base64.b64decode(text[:2295] + text[2297:] + 'w=', validate=True)
          data = b''.join(parts)
          assert hashlib.sha256(data).hexdigest() == '8f2cd4f93ab4db1be4c3c894da7b768c8dd582c51250dfb1eadbe210dd997f8c'
          patch = bz2.decompress(data)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero'], input=patch, check=True)
          for p in paths: p.unlink()
          ci = subprocess.check_output(['git', 'show', '9b6abdb8b02e9e0814c99574b7aff989d3a84f63:.github/workflows/ci.yml']).decode()
          ci = ci.replace('run: npm run play:cli -- --replay docs/playtests/cli-feedback-20260917.jsonl', 'run: npm run play:cli -- --replay docs/playtests/cli-synthesis-20260917.jsonl')
          extra = "      - name: Check out the September 17 feedback rules\n        uses: actions/checkout@v4\n        with:\n          ref: 9b6abdb8b02e9e0814c99574b7aff989d3a84f63\n          path: artifacts/september17-rules\n          persist-credentials: false\n      - name: Verify the unmodified September 17 feedback recording\n        run: |\n          ln -s \"$GITHUB_WORKSPACE/node_modules\" artifacts/september17-rules/node_modules\n          npm --prefix artifacts/september17-rules run play:cli -- --replay \"$GITHUB_WORKSPACE/docs/playtests/cli-feedback-20260917.jsonl\"\n"
          ci = ci.replace('      - name: Check out the September 15 feedback rules', extra + '      - name: Check out the September 15 feedback rules')
          Path('.github/workflows/ci.yml').write_text(ci)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run deploy
      - run: npm run play:cli -- --replay docs/playtests/cli-synthesis-20260917.jsonl
      - name: Require the exact verified final tree and publish business changes
        run: |
          git add -A
          test "$(git write-tree)" = '5f999060a52900b91fdc74266123fc17ba342ace'
          # Restore the bootstrap workflow for this bot push; the connector restores full CI next.
          cp /tmp/haojie-bootstrap-ci.yml .github/workflows/ci.yml
          git add .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement verified 2.5 synthesis rules, UI and AI'
          git push origin HEAD:refs/heads/feat/2.5-synthesis
