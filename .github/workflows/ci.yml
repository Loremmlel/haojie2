name: Inspect exact source transfer
on:
  pull_request:
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'Loremmlel/haojie2' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/2.5-synthesis'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: tar -czf /tmp/synthesis-transfer.tar.gz .github/synthesis-part-*.bz2
      - uses: actions/upload-artifact@v4
        with:
          name: synthesis-transfer
          path: /tmp/synthesis-transfer.tar.gz
          retention-days: 1
