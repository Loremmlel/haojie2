name: Verify and build single HTML
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact dependency tree
        run: npm ci --no-audit --no-fund
      - name: Package auditable source snapshot
        run: |
          mkdir -p artifacts
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./artifacts' --exclude='./dist' -czf artifacts/haojie2-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: artifacts/haojie2-source.tar.gz
          retention-days: 7
      - run: npm run format:check
      - run: npm run check
      - run: |
          set -o pipefail
          npm test | tee artifacts/engine-report.txt
      - run: npm run deploy:check
      - name: Install browser for acceptance testing
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:pages
      - run: npm run test:browser:ai
      - run: npm run test:browser:vfx
      - name: Verify current rules CLI command fingerprints
        run: npm run play:cli -- --replay docs/playtests/cli-feedback-20260917.jsonl
      - name: Check out the September 15 feedback rules
        uses: actions/checkout@v4
        with:
          ref: 1d31a7db858b6596c175de8e135a43e0e2fd66c3
          path: artifacts/feedback-rules
          persist-credentials: false
      - name: Verify the unmodified September 15 feedback recording
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" artifacts/feedback-rules/node_modules
          npm --prefix artifacts/feedback-rules run play:cli -- --replay "$GITHUB_WORKSPACE/docs/playtests/cli-feedback-20260915.jsonl"
      - name: Check out the rules used to record historical playtests
        uses: actions/checkout@v4
        with:
          ref: 3a856cf3177dea7eb8c8c20d942199bd2da2fd1a
          path: artifacts/legacy-rules
          persist-credentials: false
      - name: Verify historical fingerprints under their original rules
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" artifacts/legacy-rules/node_modules
          npm --prefix artifacts/legacy-rules run play:cli -- --replay "$GITHUB_WORKSPACE/docs/playtests/cli-human-20260907.jsonl.gz"
          npm --prefix artifacts/legacy-rules run play:cli -- --replay "$GITHUB_WORKSPACE/docs/playtests/cli-manual-budget-20260908.jsonl.gz"
      - name: Upload the playable standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: haojie2-single-html
          path: dist/index.html
          if-no-files-found: error
          retention-days: 30
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: |
            artifacts/*.png
            artifacts/*report.json
            artifacts/engine-report.txt
          if-no-files-found: ignore
          retention-days: 7
