name: Verify and build single HTML
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact dependency tree
        run: npm ci --no-audit --no-fund
      - name: Package auditable source snapshot
        run: |
          mkdir -p artifacts
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./artifacts' --exclude='./dist' -czf artifacts/haojie2-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: artifacts/haojie2-source.tar.gz
          retention-days: 7
      - run: npm run format:check
      - run: npm run check
      - run: npm run train:rules:check
      - run: npm run check:structure
      - run: |
          set -o pipefail
          npm test | tee artifacts/engine-report.txt
      - run: npm run deploy:check
      - name: Install browser for acceptance testing
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node tests/browser/console/native.mjs
      - run: npm run test:browser:library
      - run: npm run test:pages
      - run: npm run test:browser:ai
      - run: npm run test:browser:vfx
      - run: npm run test:browser:shrine
      - run: npm run test:browser:feedback3
      - run: npm run test:browser:feedback4
      - run: npm run test:browser:online
      - run: node --import tsx scripts/ai/shrine-smoke.ts
      - name: Verify current rules CLI command fingerprints
        run: npm run play:cli -- --replay docs/playtests/current/cli-feedback5-20260923.jsonl
      - name: Upload the playable standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: haojie2-single-html
          path: dist/index.html
          if-no-files-found: error
          retention-days: 30
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: |
            artifacts/*.png
            artifacts/*report.json
            artifacts/engine-report.txt
          if-no-files-found: ignore
          retention-days: 7
