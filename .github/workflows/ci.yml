name: Verify and build single HTML
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact dependency tree
        run: |
          if test -f package-lock.json; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Record the initial dependency lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: lock verified dependency versions'
            git push origin HEAD:main
          fi
      - name: Package auditable source snapshot
        run: |
          mkdir -p artifacts
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./artifacts' --exclude='./dist' -czf artifacts/haojie2-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: artifacts/haojie2-source.tar.gz
          retention-days: 7
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install browser for acceptance testing
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload the playable standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: haojie2-single-html
          path: dist/index.html
          if-no-files-found: error
          retention-days: 30
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: |
            artifacts/*.png
            artifacts/browser-report.json
          if-no-files-found: ignore
          retention-days: 7
