name: Historical replay verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: b49223f9f8f3e8beb55199b963afbd4bf2020126
            records: cli-counter-freeze-20260921.jsonl
          - ref: 4cdea28c22b599ed09ca8be67e30d3393cf109f1
            records: cli-feedback4-20260921.jsonl
          - ref: 7824f47c0deb0797819833f6641021f87f4aecbd
            records: cli-feedback3-20260920.jsonl
          - ref: ef3c9ad75ecaf99878d2b8f1560b2dc25e907d04
            records: cli-shrine-20260918.jsonl
          - ref: ae797bf25cc7f25ad746a43662324c8a3ec4fe46
            records: cli-synthesis-20260917.jsonl
          - ref: 9b6abdb8b02e9e0814c99574b7aff989d3a84f63
            records: cli-feedback-20260917.jsonl
          - ref: 1d31a7db858b6596c175de8e135a43e0e2fd66c3
            records: cli-feedback-20260915.jsonl
          - ref: 3a856cf3177dea7eb8c8c20d942199bd2da2fd1a
            records: cli-human-20260907.jsonl.gz cli-manual-budget-20260908.jsonl.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: artifacts/historical
          persist-credentials: false
      - name: Replay unmodified recordings with their original rules
        env:
          RECORDS: ${{ matrix.records }}
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" artifacts/historical/node_modules
          for record in $RECORDS; do
            npm --prefix artifacts/historical run play:cli -- --replay "$GITHUB_WORKSPACE/docs/playtests/$record"
          done
