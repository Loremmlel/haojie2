name: Final source formatting and acceptance
on:
  push:
    paths: ['.github/workflows/finish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --save-dev --save-exact prettier@3.6.2 --no-audit --no-fund
      - name: Finalize accessible controls and visual path snapshots
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          function edit(path,from,to){const s=readFileSync(path,'utf8');if(!s.includes(from))throw new Error(`Expected source fragment missing: ${path}`);writeFileSync(path,s.replace(from,to));}
          const p=JSON.parse(readFileSync('package.json','utf8'));
          p.scripts.format='prettier --write .';p.scripts['format:check']='prettier --check .';writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          edit('src/ui/Game.tsx',`<button onClick={()=>setModal('codex')}>`,`<button aria-label="棋子图鉴" onClick={()=>setModal('codex')}>`);
          edit('src/ui/Game.tsx',`<button onClick={()=>setModal('rules')}>`,`<button aria-label="规则" onClick={()=>setModal('rules')}>`);
          edit('src/ui/Game.tsx','局面已同步至本机',`{storageKey ? '自动存档已启用' : '宿主负责保存'}`);
          edit('src/ui/Game.tsx','离线可玩 · 同屏双人 · 自动保存','离线可玩 · 同屏双人');
          edit('src/ui/Game.tsx','<input value={seedText}','<input type="number" step="1" value={seedText}');
          edit('src/engine/types.ts','  from?: Point; to?: Point; unitId?: string; owner?: Player; amount?: number; text?: string;','  path?: Point[];\n  from?: Point; to?: Point; unitId?: string; owner?: Player; amount?: number; text?: string;');
          edit('src/engine/state.ts',"import { adjacent, cells, other } from './geometry';","import { adjacent, cells, other, attackPath, targetAt } from './geometry';");
          edit('src/engine/state.ts','  s.events.push(snapshot);',`  if (event.type === 'attack' && event.from && 'kind' in event.from && event.to) {
            const target = targetAt(s,event.to);
            const route = target && attackPath(s,event.from as Unit,target,117);
            if (route) snapshot.path = route.map(p => ({x:p.x,y:p.y}));
          }
          s.events.push(snapshot);`);
          appendFileSync('src/ui/refinements.css','\n@media (prefers-reduced-motion: reduce) { .hj-game .shot-core { display: none; } }\n');
          edit('README.md','## 验证','## 验证\n\n源码使用Prettier统一格式化；`npm run format`整理源码，`npm run format:check`检查格式。\n');
          appendFileSync('tests/engine.test.ts',String.raw`
          test('attack animation records the same legal detour as the rules',()=>{
            const s=fixture(),a=add(s,1,1,1,2),b=add(s,1,2,3,2);add(s,1,2,2,2);
            const n=strike(s,a,b),path=n.events.find(e=>e.type==='attack')?.path;
            assert.ok(path);assert.equal(path.length,5);
            assert.deepEqual(path[0],{x:1,y:2});assert.deepEqual(path.at(-1),{x:3,y:2});
            assert.equal(path.some(p=>p.x===2&&p.y===2),false);
          });
          test('friendly overkill reflects actual HP lost, even if the mirror dies',()=>{
            const s=fixture(),a=add(s,1,1,2,4),mirror=add(s,16,1,3,4),enemy=add(s,'grave',2,3,5);mirror.hp=5;
            let n=strike(s,a,mirror);assert.equal(n.pending[0].amount,5);
            assert.deepEqual(parseSession(JSON.stringify(createSession(n))).present,n);
            n=applyCommand(n,{type:'react',targetId:enemy.id});assert.equal(unit(n,enemy.id).hp,65);
          });
          test('a completely blocked deployment zone discards the impossible minion instead of deadlocking',()=>{
            const s=fixture();for(const p of ALL_CELLS)if(p.y<=8&&!(p.x===5&&p.y===1))add(s,'grave',1,p.x,p.y);
            card(s,1);const n=applyCommand(s,{type:'end'});assert.equal(n.active,2);assert.equal(n.hands[1].length,0);
            assert.ok(n.log.some(line=>line.includes('自动弃置')));
          });
          `);
          JS
      - run: npm run format
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Commit verified formatted sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: format verified sources and finalize accessible battle feedback'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: finalized-single-html
          path: dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: finalized-acceptance
          path: |
            artifacts/*.png
            artifacts/browser-report.json
