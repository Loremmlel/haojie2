name: Apply and verify Haojie 2.0
on:
  push:
    branches: [feat/haojie-2-rules-and-ultimate]
    paths: ['.github/workflows/apply-v2.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore the locally verified source changes
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, pathlib, shutil, tarfile
          root = pathlib.Path.cwd()
          parts = sorted((root / '.v2-transport').glob('part*.txt'))
          assert len(parts) == 9, 'Incomplete source transfer'
          data = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          assert len(data) == 106232
          assert hashlib.sha256(data).hexdigest() == '926c4f48856ce68a82f3b6b0acb02b0299ffb4cf9955bbf6eeb693426eafe72d'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(data)), mode='r:') as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] != '.git'
                  if member.name == '_delete.json':
                      removals = json.loads(archive.extractfile(member).read())
                      assert removals == ['tests/engine.test.ts']
                      for name in removals:
                          (root / name).unlink(missing_ok=True)
                  else:
                      destination = root / member.name
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(archive.extractfile(member).read())
          shutil.rmtree(root / '.v2-transport')
          (root / '.github/workflows/apply-v2.yml').unlink()
          print('Restored 37 source and documentation files; transport removed.')
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - run: npm run format:check
      - run: npm run check
      - name: Run all rule and save behavior tests
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm test | tee artifacts/engine-report.txt
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify actual offline file HTML in Chromium
        run: npm run test:browser
      - name: Commit only verified source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement Haojie 2.0 rules, ultimate summons and weapons'
          git push origin HEAD:feat/haojie-2-rules-and-ultimate
          git rev-parse HEAD | tee artifacts/verified-commit.txt
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./artifacts' --exclude='./dist' -czf artifacts/haojie2-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: haojie-v2-single-html
          path: dist/index.html
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: haojie-v2-source
          path: artifacts/haojie2-source.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haojie-v2-acceptance
          path: |
            artifacts/*.png
            artifacts/*.json
            artifacts/*.txt
          if-no-files-found: ignore
          retention-days: 7
