name: Finalize online adapter handoff
on:
  push:
    branches: [feat/online-adapter]
    paths: ['.github/workflows/online-dev.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/online-adapter
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Complete user-facing entry points and evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const read = (path) => readFileSync(path, 'utf8');
          const write = (path, text) => writeFileSync(path, text);
          const section = '## 联机嵌入（宿主接管）';
          if (!read('README.md').includes(section)) {
            write('README.md', read('README.md').replace('## 3.0：神龛', section + '\n\n新增受控入口 `HaojieOnlineGame`，与原本地 `HaojieGame` 共用棋盘、交互和表现；本地双人、人机、存档和单HTML入口不变。网站可在服务端调用 `applyPlayerCommand` 并分别下发 `getPlayerView`，处理账号、房间、WS和持久化。**这是联机适配能力，不是已上线的联机服务器。** 接口、错误/重连语义及维护约束见[接入文档](docs/ONLINE-ADAPTATION.md)，双棋盘示例见[TwoPlayerDemo](examples/online/TwoPlayerDemo.tsx)。\n\n## 3.0：神龛'));
          }
          const architecture = '\n## 3.0：可受控会话与玩家视图\n\n本地入口继续由useGameController/useGameSession持有Session、历史、存储和AI；HaojieOnlineGame由useOnlineController接收宿主修订快照及明确回执。两者共用GameSurface、useGameInteraction和useGamePresentation，不复制棋盘或技能。GamePosition没有seed/rng，GameState保留完整权威字段；公开预检在需要随机值前停止，不制造假随机状态。服务端applyPlayerCommand负责运行时结构与操作者权限，getPlayerView负责嵌套可见性；房间、账号、WS、持久化与提交去重属于宿主。完整协议见[ONLINE-ADAPTATION.md](ONLINE-ADAPTATION.md)。\n';
          if (!read('docs/ARCHITECTURE.md').includes('## 3.0：可受控会话与玩家视图')) write('docs/ARCHITECTURE.md', read('docs/ARCHITECTURE.md') + architecture);
          const evidence = '\n## 本次执行记录\n\n2026-09-20，运行代码与单文件成品提交 `5c1d228d8d3b1a40fd10e9f13f257ea4ebd3c156` 通过[完整分支验收](https://github.com/Loremmlel/haojie2/actions/runs/35485444677)：TypeScript、全部行为测试、构建/发行一致性、本地浏览器、Pages、三档AI、VFX、神龛、反馈3、受控双客户端、神龛CLI冒烟与反馈3命令指纹。此后的交接整理仅改文档/格式和测试配置，收尾流程会检查src、tests、examples、scripts、package及index.html与该通过版本没有差异。历史规则版本的录制另由标准PR CI按固定旧提交验证。\n\n宿主应把每次发布的update/view视为不可变快照，更新时提供新对象，不要原地修改已发布局面。受控组件只缓存已接受的宿主视图，不提供自己的第二份权威结算。\n';
          if (!read('docs/ONLINE-ADAPTATION.md').includes('## 本次执行记录')) write('docs/ONLINE-ADAPTATION.md', read('docs/ONLINE-ADAPTATION.md') + evidence);
          NODE
          npx prettier --write README.md AGENTS.md docs/ONLINE-ADAPTATION.md docs/ARCHITECTURE.md tsconfig.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md docs/ONLINE-ADAPTATION.md docs/ARCHITECTURE.md tsconfig.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: finish online handoff, evidence and embedding entry points'
            git push origin HEAD:feat/online-adapter
          fi
      - name: Assert the fully tested runtime and browser tests are unchanged
        run: |
          git diff --exit-code 5c1d228d8d3b1a40fd10e9f13f257ea4ebd3c156 -- src tests examples scripts package.json package-lock.json index.html
          npx prettier --check src tests scripts examples README.md AGENTS.md docs/ONLINE-ADAPTATION.md docs/ARCHITECTURE.md package.json tsconfig.json .github/workflows/ci.yml
          npm run check
          npm run deploy:check
          git status --short
          git rev-parse HEAD
