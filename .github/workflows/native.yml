name: Native engine
on:
  push:
    branches: [main, 'codex/**']
    paths:
      [
        'native/**',
        'src/**',
        'scripts/training/**',
        'training/**',
        'tests/**',
        'package*.json',
        '.github/workflows/native.yml',
      ]
  pull_request:
    paths:
      [
        'native/**',
        'src/**',
        'scripts/training/**',
        'training/**',
        'tests/**',
        'package*.json',
        '.github/workflows/native.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: cargo fmt --manifest-path native/engine/Cargo.toml --check
      - run: npm run native:test
      - run: npm run native:check
      - run: npm run native:build
      - run: npm run train:rules:check
      - name: Install BF16 contract test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install ./training
      - name: Native threads, V-trace and in-flight recovery
        shell: pwsh
        run: |
          $env:HAOJIE_NATIVE_LIB = if ($IsWindows) { "$PWD/artifacts/native-target/release/haojie_native.dll" } else { "$PWD/artifacts/native-target/release/libhaojie_native.so" }
          python -m unittest discover -s training/tests/online -p 'test_*.py' -v
          exit $LASTEXITCODE
      - name: Rules, public action tree, encoding and record audit
        shell: pwsh
        run: |
          $engine = if ($IsWindows) { 'artifacts/native-target/release/haojie-engine.exe' } else { 'artifacts/native-target/release/haojie-engine' }
          python scripts/training/native/ci/verify.py --engine $engine
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --import tsx scripts/training/native/validate.ts --executable $engine --fixtures-only --output artifacts/native-rules
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --import tsx scripts/training/native/sampling/validate.ts --executable $engine --output artifacts/native-encoding
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --import tsx --test tests/runtime/native-record.test.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --import tsx scripts/training/native/ci/hashes.ts --executable $engine --output artifacts/native-hashes.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          retention-days: 7
          path: |
            artifacts/native-target/release/haojie-engine*
            artifacts/native-target/release/*haojie_native*
            artifacts/native-rules/*.json
            artifacts/native-encoding/*.json
            artifacts/native-hashes.json
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/training/native/pipeline/package.py --output artifacts/native-package/source.tar.gz
      - run: docker build -f scripts/training/native/ci/Dockerfile -t haojie-native-check artifacts/native-package
      - name: Installed native library and recovery checks
        run: |
          mkdir -p artifacts/native-evidence
          docker run --rm --network none --user "$(id -u):$(id -g)" --env HOME=/tmp --mount type=bind,source="$PWD/artifacts/native-evidence",target=/evidence haojie-native-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-installed
          path: |
            artifacts/native-package/*
            artifacts/native-evidence/*
