name: Native engine
on:
  push:
    branches: [main, 'codex/**']
    paths:
      [
        'native/**',
        'src/**',
        'scripts/training/**',
        'training/**',
        'tests/**',
        'package*.json',
        '.github/workflows/native.yml',
      ]
  pull_request:
    paths:
      [
        'native/**',
        'src/**',
        'scripts/training/**',
        'training/**',
        'tests/**',
        'package*.json',
        '.github/workflows/native.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: cargo fmt --manifest-path native/engine/Cargo.toml --check
      - run: npm run native:test
      - run: npm run native:check
      - run: npm run native:build
      - run: npm run train:rules:check
      - name: Obtain C++ libraries and build standalone host
        shell: pwsh
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $torchRoot = python -c "import pathlib, torch; print(pathlib.Path(torch.__file__).parent)"
          cmake -S training/native -B artifacts/cpp-training-build "-DLIBTORCH=$torchRoot" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build artifacts/cpp-training-build --config Release -j 2
          exit $LASTEXITCODE
      - name: Standalone BF16 and in-flight continuation without Python on PATH
        shell: pwsh
        run: |
          $torchRoot = python -c "import pathlib, torch; print(pathlib.Path(torch.__file__).parent)"
          $binary = if ($IsWindows) { "$PWD/artifacts/cpp-training-build/Release/haojie-train.exe" } else { "$PWD/artifacts/cpp-training-build/haojie-train" }
          $previousPath = $env:PATH
          try {
            $env:PATH = if ($IsWindows) { "$torchRoot/lib;$PWD/artifacts/native-target/release" } else { '' }
            & $binary check --device cpu
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & $binary run --directory artifacts/native-ci/live --device cpu --concurrency 4 --workers 2 --batch 128 --samples 256 --save-seconds 0
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & $binary run --directory artifacts/native-ci/restored --resume artifacts/native-ci/live/checkpoint.pt --device cpu --concurrency 4 --workers 2 --samples 128 --save-seconds 0
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $window = Get-Content artifacts/native-ci/restored/window.json -Raw | ConvertFrom-Json
            if ($window.consumed -ne 128) { throw 'Incorrect resumed window consumption' }
          } finally { $env:PATH = $previousPath }
      - name: Colab control and real AI evaluation bridge
        shell: pwsh
        run: |
          python -m pip install mini-racer==0.14.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/training/native/teacher/build.mjs --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -m unittest training.colab.test_panel training.evaluation.test_evaluation
          exit $LASTEXITCODE
      - name: Rules, public tree, encoding and record audit
        shell: pwsh
        run: |
          $engine = if ($IsWindows) { 'artifacts/native-target/release/haojie-engine.exe' } else { 'artifacts/native-target/release/haojie-engine' }
          python scripts/training/native/ci/verify.py --engine $engine
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --import tsx scripts/training/native/validate.ts --executable $engine --fixtures-only --output artifacts/native-rules
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --import tsx scripts/training/native/sampling/validate.ts --executable $engine --output artifacts/native-encoding
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --import tsx --test tests/runtime/native-record.test.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --import tsx scripts/training/native/ci/hashes.ts --executable $engine --output artifacts/native-hashes.json
          exit $LASTEXITCODE
      - name: Package native source
        run: python scripts/training/native/pipeline/package.py --output artifacts/native-package/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          retention-days: 7
          path: |
            artifacts/native-ci/**
            artifacts/native-rules/*.json
            artifacts/native-encoding/*.json
            artifacts/native-hashes.json
            artifacts/native-package/*
