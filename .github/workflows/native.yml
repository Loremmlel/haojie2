name: Native engine
on:
  push:
    branches: [main, 'codex/**']
    paths:
      [
        'native/**',
        'training/**',
        'src/**',
        'scripts/native/**',
        'tests/**',
        'package*.json',
        '.github/workflows/native.yml',
      ]
  pull_request:
    paths:
      [
        'native/**',
        'training/**',
        'src/**',
        'scripts/native/**',
        'tests/**',
        'package*.json',
        '.github/workflows/native.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: cargo fmt --manifest-path native/engine/Cargo.toml --check
      - run: rustfmt --edition 2024 --check native/engine/src/modules.rs
      - run: npm run native:rules:check
      - run: npm run native:test
      - run: npm run native:check
      - run: npm run native:build
      - run: node --import tsx scripts/native/engine/validation/run.ts --output artifacts/native-rules
      - run: node --import tsx scripts/native/learning/validate.ts --evaluation --candidates --search --decoder
      - run: node --import tsx scripts/native/learning/teacher-validation.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r training/requirements.txt
      - run: python -m unittest training.tests.test_training training.tests.test_web -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          retention-days: 7
          path: artifacts/native-rules/*.json
