name: Prepare verification workspace
on:
  push:
    paths: ['.github/workflows/workspace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: |
          mkdir -p artifacts
          tar --exclude='./.git' --exclude='./artifacts' -czf artifacts/workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: verification-workspace
          path: artifacts/workspace.tar.gz
          retention-days: 1
