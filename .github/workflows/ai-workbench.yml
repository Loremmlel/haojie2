name: Temporary AI audit patch import
on:
  push:
    branches: [fix/ai-budget-audit]
    paths: ['.github/workflows/ai-workbench.yml', '.github/ai-audit-patch.part*']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-budget-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply the locally tested source patch
        run: |
          cat .github/ai-audit-patch.part{0,1,2,3,4,5,6,7} > /tmp/ai-audit-patch.tar.xz
          echo '7262ebc904b3871b34d13a49796c23c3bb58001e2888c908a0a3550ca1ee2d7e  /tmp/ai-audit-patch.tar.xz' | sha256sum -c -
          mkdir -p /tmp/haojie-audit
          tar -xJf /tmp/ai-audit-patch.tar.xz -C /tmp/haojie-audit
          git apply --check /tmp/haojie-audit/audit.patch
          git apply /tmp/haojie-audit/audit.patch
          cp /tmp/haojie-audit/docs/playtests/cli-manual-budget-20260908.jsonl.gz docs/playtests/
          rm .github/ai-audit-patch.part{0,1,2,3,4,5,6,7} .github/workflows/ai-workbench.yml
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run deploy && npm run deploy:check
      - name: Verify both manual command transcripts
        run: |
          npm run play:cli -- --replay docs/playtests/cli-human-20260907.jsonl.gz
          npm run play:cli -- --replay docs/playtests/cli-manual-budget-20260908.jsonl.gz
      - name: Commit validated source and its standalone HTML together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix(ai): reserve paired replies and make production work reproducible' -m 'Narrow self search, preserve complete paired reply rounds, stop begin-phase cached plans at the phase boundary, share combat probability rules and improve focus-fire, survival and payload interception. Keep exact cache validation and real RNG semantics. Add 149 passing behavior contracts in total, production-path audit, frozen paired comparisons and 115 manually played CLI commands with validated replay. Work mode is reproducible but NOT a hard one-second latency promise; document measured long-game tail costs. Remove temporary patch-import infrastructure.'
          git push origin HEAD:fix/ai-budget-audit
