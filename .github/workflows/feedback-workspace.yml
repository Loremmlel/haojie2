name: Feedback verification workspace
on:
  push:
    branches: [codex/rules-feedback-20260915]
    paths: [.github/workflows/feedback-workspace.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: tar -czf feedback-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: feedback-dependencies
          path: feedback-dependencies.tar.gz
          retention-days: 1
