name: Verify full-height desktop workbench
on:
  push:
    branches: [fix/desktop-fit-workbench]
    paths: ['.github/workflows/fit-board.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore layout-only changes against the verified 2.1 baseline
        run: |
          python3 - <<'PY'
          import pathlib, base64, hashlib, json, lzma, zlib, subprocess
          root = pathlib.Path.cwd()
          data = base64.b64decode((root / '.layout-transfer.txt').read_text(), validate=True)
          assert hashlib.sha256(data).hexdigest() == 'bd548f06a23ce0fff5033b6a9bacba4af80165a32c8ae68f6584ab9b8f5d3ee4'
          patch = json.loads(lzma.decompress(data))
          assert len(patch['files']) == 28
          restored = []
          for entry in patch['files']:
              path = pathlib.PurePosixPath(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in {'src', 'tests', 'docs', 'README.md', 'AGENTS.md'}
              encoded = base64.b64decode(entry['data'], validate=True)
              if entry['dictionary']:
                  old = subprocess.check_output(['git', 'show', '2898013a65993549057d2adc974885d18bf44072:' + entry['path']])[-32768:]
                  assert hashlib.sha256(old).hexdigest() == entry['oldSha256']
                  decoder = zlib.decompressobj(zdict=old)
                  content = decoder.decompress(encoded) + decoder.flush()
              else:
                  content = zlib.decompress(encoded)
              assert hashlib.sha256(content).hexdigest() == entry['sha256']
              restored.append((root / path, content))
          for path, content in restored:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          (root / '.layout-transfer.txt').unlink()
          print('Restored', len(restored), 'UI, layout behavior tests and documentation files.')
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - run: npm run format
      - run: npm run format:check
      - run: npm run check
      - run: |
          mkdir -p artifacts
          set -o pipefail
          npm test | tee artifacts/engine-report.txt
      - run: npm run deploy
      - run: npm run deploy:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:pages
      - name: Verify all 117 cells fit without page scrolling, plus AI acceptance
        run: npm run test:browser:ai
      - name: Commit only verified source and generated single HTML
        run: |
          git restore .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(layout): fit the full board in a full-width desktop workbench'
          git push origin HEAD:fix/desktop-fit-workbench
          git rev-parse HEAD > artifacts/verified-commit.txt
      - name: Package source snapshot
        if: always()
        run: |
          mkdir -p artifacts
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./artifacts' --exclude='./dist' --exclude='./.layout-transfer.txt' -czf artifacts/haojie-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-source
          path: artifacts/haojie-source.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-evidence
          path: |
            artifacts/*.png
            artifacts/*report.json
            artifacts/*.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-single-html
          path: dist/index.html
          retention-days: 30
